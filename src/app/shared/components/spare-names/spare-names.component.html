<div class="reverse-bowling-layout">
  <div class="pin-row">
    <ion-button class="pin" data-pin="7" [class.active]="selectedPins().includes(7)" (click)="togglePin(7)"> 7 </ion-button>
    <ion-button class="pin" data-pin="8" [class.active]="selectedPins().includes(8)" (click)="togglePin(8)"> 8 </ion-button>
    <ion-button class="pin" data-pin="9" [class.active]="selectedPins().includes(9)" (click)="togglePin(9)"> 9 </ion-button>
    <ion-button class="pin" data-pin="10" [class.active]="selectedPins().includes(10)" (click)="togglePin(10)"> 10 </ion-button>
  </div>
  <div class="pin-row">
    <ion-button class="pin" data-pin="4" [class.active]="selectedPins().includes(4)" (click)="togglePin(4)"> 4 </ion-button>
    <ion-button class="pin" data-pin="5" [class.active]="selectedPins().includes(5)" (click)="togglePin(5)"> 5 </ion-button>
    <ion-button class="pin" data-pin="6" [class.active]="selectedPins().includes(6)" (click)="togglePin(6)"> 6 </ion-button>
  </div>
  <div class="pin-row">
    <ion-button class="pin" data-pin="2" [class.active]="selectedPins().includes(2)" (click)="togglePin(2)"> 2 </ion-button>
    <ion-button class="pin" data-pin="3" [class.active]="selectedPins().includes(3)" (click)="togglePin(3)"> 3 </ion-button>
  </div>
  <div class="pin-row">
    <ion-button class="pin" data-pin="1" [class.active]="selectedPins().includes(1)" (click)="togglePin(1)"> 1 </ion-button>
  </div>
</div>

<div class="pin-names">
  <p>{{ displayedNames() }}</p>
  <h1 *ngIf="spareName()">"{{ spareName() }}"</h1>
</div>
