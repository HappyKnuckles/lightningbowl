name: E2E

# Slower and more failure-prone than the unit suite, so it runs on pull requests
# only and lives outside CI's critical path.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11
        # package-lock.json is written by npm 11, which nests webpack-dev-server's
        # chokidar@3.6.0 subtree under it. npm 10 (what Node 22 ships) expects those
        # four packages hoisted to the root instead and rejects the lockfile as out
        # of sync. Predates this pipeline — it just had no CI to surface it.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        # Both e2e projects ("chromium" and "mobile") run on Chromium — the mobile
        # one is Chromium with an iPhone viewport and iOS user agent.
        run: npx playwright install --with-deps chromium

      - name: Run functional e2e suite
        # playwright.e2e.config.ts already adapts to CI: 1 worker, 2 retries,
        # forbidOnly, and the github reporter. It boots its own dev server; set
        # E2E_SERVE_CMD / E2E_BASE_URL here if that ever needs to change.
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-report
          path: |
            playwright/.e2e-report
            playwright/.e2e-artifacts
          retention-days: 7
