<div class="pin-deck-container" [class.stat-mode]="isStatPage()" [style.transform]="'scale(' + scale() + ')'">
  @for (row of pinDeck(); track trackByRow($index)) {
    <div class="pin-row">
      @for (pin of row; track trackByPinId($index, pin)) {
        <div class="pin" [class.active]="pin.active" [class.is-split]="isSplit() && pin.active && isStatPage()" aria-hidden="true"></div>
      }
    </div>
  }
</div>
