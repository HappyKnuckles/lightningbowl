name: CodeQL

on:
  pull_request:
  push:
    branches: [test]
  schedule:
    # Weekly, so advisories that land after a merge still get caught.
    - cron: "0 4 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # No compilation needed for JS/TS — CodeQL reads the sources directly.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
