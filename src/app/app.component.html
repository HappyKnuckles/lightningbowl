<ion-app>
  <app-side-menu></app-side-menu>
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
@if (loadingService.isLoading()) {
  <ion-backdrop style="opacity: 0.4; z-index: 999999"></ion-backdrop>
  <app-bowling-refresher class="custom-loader" [align]="'middle'" [background]="'none'" [refreshing]="true" [size]="0.5"></app-bowling-refresher>
}
<app-toast></app-toast>

<!-- PWA Install Prompt -->
<app-pwa-install-prompt [canInstall]="canInstallPwa" [isOpen]="showPwaInstallPrompt" (dismiss)="onPwaDismiss()" (install)="onPwaInstall()">
</app-pwa-install-prompt>
