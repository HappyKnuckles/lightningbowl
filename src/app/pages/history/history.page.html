<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button menu="main-menu"></ion-menu-button>
    </ion-buttons>
    <ion-title>
      History
      <ion-badge>{{ gameFilterService.filteredGames().length }}</ion-badge>
    </ion-title>
    <ion-buttons class="action-sheet" slot="end">
      <!-- <app-sort-header
        [id]="'game-sort-header'"
        [sortOptions]="sortService.GAME_SORT_OPTIONS"
        [selectedSort]="currentSortOption"
        storageKey="games-sort-option"
        (sortChanged)="onSortChanged($event)">
      </app-sort-header> -->
      <ion-button fill="clear" [disabled]="gamesStore.games().length <= 0 && !loadingService.isLoading()" (click)="openFilterModal()">
        <ion-icon name="filter-outline" slot="icon-only"></ion-icon>
        <ion-text *ngIf="gameFilterService.activeFilterCount() !== 0" class="filter-indicator">{{ gameFilterService.activeFilterCount() }}</ion-text>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar *ngIf="gameFilterService.activeFilterCount() !== 0" style="text-align: center">
    <app-generic-filter-active [defaultFilters]="defaultFilters" [filterConfigs]="gameFilterConfigs" [filters]="currentFilters()">
    </app-generic-filter-active>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <app-bowling-refresher [refreshing]="isRefreshing()"></app-bowling-refresher>
  </ion-refresher>

  <!-- Show this message if there are no game history items and it's not loading -->
  <ng-container *ngIf="gamesStore.games().length <= 0 && !loadingService.isLoading(); else checkFilteredGames">
    <ion-text class="no-game-text"> Start playing a few games to see your history here! </ion-text>
  </ng-container>
  <ng-template #checkFilteredGames>
    <ng-container *ngIf="gameFilterService.filteredGames().length <= 0 && !loadingService.isLoading(); else content">
      <ion-text class="no-game-text"> No games for this filter! </ion-text>
    </ng-container>
  </ng-template>
  <!-- Main content to display when there is game history or when loading is done -->
  <ng-template #content>
    <!-- <ion-button (click)="deleteAll()">Delete</ion-button>-->
    <app-game-list [games]="gameFilterService.filteredGames()"></app-game-list>
  </ng-template>
</ion-content>
