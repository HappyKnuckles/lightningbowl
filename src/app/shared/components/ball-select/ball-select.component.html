<ion-header>
  <ion-toolbar>
    <ion-title>Balls</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-list>
    @for (row of rows(); track row.ball.arsenalId) {
      <ion-item [lines]="$last ? 'none' : ''">
        <ion-avatar slot="start" (click)="toggleBallSelection(row.ball)">
          <img [src]="row.ball | ballImage" [alt]="row.ball.ball_name + 'image'" />
        </ion-avatar>
        <ion-checkbox justify="space-between" [checked]="row.selected" (ionChange)="toggleBallSelection(row.ball)">
          <ion-label>
            <h2>{{ row.ball.ball_name }} {{ row.ball.core_weight }}lbs</h2>
            <p>{{ row.detail }}</p>
          </ion-label>
        </ion-checkbox>
      </ion-item>
    }
  </ion-list>
</ion-content>
<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="end" class="modal-buttons">
      <ion-button (click)="cancelBallSelection()" fill="clear" class="modal-button cancel-button">Cancel</ion-button>
      <ion-button (click)="confirmBallSelection()" fill="clear" class="modal-button ok-button">OK</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
