name: Issue triage

on:
  issues:
    # `labeled` is the re-run handle: add the "triage" label from the issue page
    # and this runs again. The bot's own labels are applied with GITHUB_TOKEN,
    # which by design never triggers another workflow, so there is no loop.
    types: [opened, labeled]
  issue_comment:
    # Mentioning @claude in a reply re-runs triage with the discussion in context.
    # Bot comments are posted with GITHUB_TOKEN and so raise no event — no loop.
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to (re-)triage
        type: number
        required: true

permissions:
  contents: read

jobs:
  # The reusable workflow filters events itself: a new issue, the "triage" label,
  # an @claude reply on an issue, or a manual dispatch.
  triage:
    permissions:
      contents: read
      issues: write
    uses: HappyKnuckles/github-workflows/.github/workflows/claude-issue-triage.yml@v1
    with:
      issue-number: ${{ github.event.issue.number || inputs.issue_number }}
      project-description: an Angular 21 + Ionic 8 offline-first bowling score tracker
      domain-vocabulary: frames, throws, arsenal, oil patterns, leagues, series
      example-file-link: "[games.store.ts](src/app/core/stores/games.store.ts)"
      where-it-lands-hints: >-
        Cover the store/service layer, the page or component, and the route or
        `moreTabs` entry when a new page is involved.
      watch-out-hints: >-
        offline-first storage through StorageRepository and storage-keys.ts, signal
        stores rather than new state containers, existing Ionic components to reuse,
        theme variables over hardcoded colors, specs that would need updating
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
