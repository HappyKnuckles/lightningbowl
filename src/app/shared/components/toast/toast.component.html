@for (toast of activeToasts; track $index) {
  <ion-toast
    #toastRef
    class="custom-toast"
    [isOpen]="true"
    [message]="toast.message"
    [icon]="toast.icon"
    [color]="toast.isError ? 'danger' : 'primary'"
    [duration]="TOAST_DURATION"
    position="bottom"
    (didPresent)="onToastDidPresent(toast.id, $event)"
    (didDismiss)="onToastDidDismiss(toast.id)"
    (click)="toastRef.dismiss()"
    swipeGesture="vertical"
    [ngStyle]="{ transform: 'translateY(-' + getOffset($index) + 'px)' }">
  </ion-toast>
}
