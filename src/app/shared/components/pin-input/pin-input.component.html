<div class="pin-input-container" [class.sheet]="sheet()">
  <!--
    In the sheet the deck sits over the score grid, so these shortcuts belong up
    next to it. Inline they'd split the card in two, so they join the row below
    the deck instead.
  -->
  @if (sheet()) {
    <div class="quick-actions">
      <ng-container [ngTemplateOutlet]="scoreShortcuts"></ng-container>
    </div>
  }

  <div class="pin-deck">
    @for (row of pinRows(); track $index) {
      <div class="pin-row">
        @for (pin of row; track pin.number) {
          <ion-button
            class="pin"
            [class.active]="pin.active"
            [class.knocked-down]="pin.knockedDown"
            [disabled]="pin.disabled"
            (click)="togglePin(pin.number)">
            {{ pin.number }}
          </ion-button>
        }
      </div>
    }

    @if (showStatsButton()) {
      <ion-button class="stats-btn" [disabled]="!statsEnabled()" fill="clear" size="small" (click)="statsClick.emit()">
        <ion-icon slot="icon-only" name="bar-chart-outline"></ion-icon>
      </ion-button>
    }
  </div>

  <!-- Actions that follow a pin selection, kept in the thumb zone below the deck. -->
  <div class="quick-actions">
    @if (!sheet()) {
      <ng-container [ngTemplateOutlet]="scoreShortcuts"></ng-container>
    }
    <ion-button size="small" (click)="clearSelectedPins()" [disabled]="!hasSelection() || isGameComplete()">
      <ion-icon slot="icon-only" name="close-circle-outline"></ion-icon>
    </ion-button>
    <ion-button size="small" (click)="undoLastThrow()" [disabled]="!canUndo()">
      <ion-icon slot="icon-only" name="arrow-undo-outline"></ion-icon>
    </ion-button>
    <ion-button size="small" (click)="confirmThrow()" [disabled]="isGameComplete()">
      <ion-icon slot="icon-only" name="checkmark-outline"></ion-icon>
    </ion-button>
  </div>
</div>

<ng-template #scoreShortcuts>
  <ion-button size="small" (click)="recordStrike()" [disabled]="!canStrike() || isGameComplete()"> X </ion-button>
  <ion-button size="small" (click)="recordSpare()" [disabled]="!canSpare() || isGameComplete()"> / </ion-button>
  <ion-button size="small" (click)="recordGutter()" [disabled]="isGameComplete()"> - </ion-button>
</ng-template>
