<svg aria-label="Ball path on the lane" class="shot-lane" role="img" [attr.viewBox]="viewBox()">
  <rect
    class="gutter"
    rx="3"
    [attr.height]="lane().height"
    [attr.width]="lane().width + 2 * lane().gutter"
    [attr.x]="lane().x - lane().gutter"
    [attr.y]="lane().y" />
  <rect class="wood" [attr.height]="lane().height" [attr.width]="lane().width" [attr.x]="lane().x" [attr.y]="lane().y" />

  @for (line of boardLines(); track line.x) {
    <line class="board" [attr.x1]="line.x" [attr.x2]="line.x" [attr.y1]="lane().y" [attr.y2]="lane().y + lane().height" [class.major]="line.major" />
  }
  @for (rect of oil().rects; track rect.key) {
    <rect
      class="oil"
      [attr.fill]="oil().color"
      [attr.fill-opacity]="rect.opacity"
      [attr.height]="rect.height"
      [attr.width]="rect.width"
      [attr.x]="rect.x"
      [attr.y]="rect.y" />
  }
  @for (mark of rangeFinders(); track mark.key) {
    <rect class="range-finder" rx="0.9" width="1.8" [attr.height]="mark.height" [attr.x]="mark.x" [attr.y]="mark.y" />
  }
  @for (arrow of arrows(); track arrow.key) {
    <polygon class="arrow" [attr.points]="arrow.points" />
  }
  @if (patternEnd(); as end) {
    <line class="pattern-end" [attr.x1]="lane().x" [attr.x2]="lane().x + lane().width" [attr.y1]="end.y" [attr.y2]="end.y" />
    <text class="pattern-end-label" [attr.x]="lane().x + 3" [attr.y]="end.y - 3">{{ end.label }}</text>
  }
  <line class="foul-line" [attr.x1]="lane().x" [attr.x2]="lane().x + lane().width" [attr.y1]="foulLineY()" [attr.y2]="foulLineY()" />
  @for (pin of pins(); track pin.key) {
    <circle class="pin" [attr.cx]="pin.x" [attr.cy]="pin.y" [attr.r]="pinRadius" />
  }

  @for (label of distanceLabels(); track label.ft) {
    <text class="axis" text-anchor="end" [attr.x]="lane().x - lane().gutter - 4" [attr.y]="label.y + 3">{{ label.ft }}'</text>
  }
  @for (label of boardLabels(); track label.board) {
    <text class="axis" text-anchor="middle" [attr.x]="label.x" [attr.y]="lane().y + lane().height + 16">{{ label.board }}</text>
  }

  <path class="ball-path" [attr.d]="path()" />

  @for (marker of markers(); track marker.key) {
    <circle class="marker" r="4.5" [attr.cx]="marker.x" [attr.cy]="marker.y" [class.breakpoint]="marker.key === 'breakpoint'" />
    <text
      class="marker-label"
      [attr.text-anchor]="marker.labelLeft ? 'end' : 'start'"
      [attr.x]="marker.labelLeft ? marker.x - 8 : marker.x + 8"
      [attr.y]="marker.y + 3.5">
      {{ marker.label }}
    </text>
  }
</svg>
