<div class="stat-wrapper">
  @if (title()) {
    <h2 class="stat-heading">{{ title() }}</h2>
  }
  <ul class="stat-card">
    @for (row of rows(); track row.key) {
      <li class="stat-row">
        <app-stat-row
          [currentStat]="row.current"
          [id]="row.id"
          [isPercentage]="row.isPercentage"
          [label]="row.label"
          [prevStat]="row.prev"
          [secondaryStat]="row.secondary"
          [toolTip]="row.toolTip" />
      </li>
    }
  </ul>
</div>
