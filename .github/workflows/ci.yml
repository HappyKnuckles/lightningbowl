name: CI

on:
  pull_request:
  push:
    branches: [main, master, test]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Jobs live in HappyKnuckles/github-workflows; bump by publishing a release there.
#
# npm-version 11: package-lock.json is written by npm 11, which nests the chokidar
# subtrees of @angular-devkit/core (chokidar@5) and sass (chokidar@3). npm 10 (what
# Node 22 ships) expects them hoisted to the root instead and rejects the lockfile
# as "out of sync". Verified still required on Angular 21.

jobs:
  verify:
    uses: HappyKnuckles/github-workflows/.github/workflows/node-ci.yml@v1
    with:
      npm-version: "11"
      # The unit-test builder transpiles without failing on type errors, so specs
      # are only typechecked here (see CLAUDE.md > Gotchas).
      typecheck-command: npx tsc -p tsconfig.spec.json --noEmit
      # Vitest browser mode runs in headless Chromium.
      install-playwright: true
      test-command: npx ng test --configuration=ci

  ball-api-types:
    uses: HappyKnuckles/github-workflows/.github/workflows/node-run.yml@v1
    with:
      npm-version: "11"
      # Ball API types match the ball API's spec.
      command: npm run generate:ball-api -- --check
      timeout-minutes: 10

  coverage:
    permissions:
      contents: read
      pull-requests: write
    uses: HappyKnuckles/github-workflows/.github/workflows/node-coverage.yml@v1
    with:
      npm-version: "11"
      install-playwright: true
      # Fails on its own if line coverage drops below the coverageThresholds
      # floor on the "test" target in angular.json.
      coverage-command: npm run test:coverage
      summary-command: node scripts/coverage-summary.mjs
