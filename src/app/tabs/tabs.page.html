<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="add">
      <ion-icon aria-hidden="true" name="add"></ion-icon>
      <ion-label>New</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="stats">
      <ion-icon aria-hidden="true" name="stats-chart-outline"></ion-icon>
      <ion-label>Stats</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="history">
      <ion-icon aria-hidden="true" name="receipt"></ion-icon>
      <ion-label>History</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="league">
      <ion-icon aria-hidden="true" name="medal-outline"></ion-icon>
      <ion-label>Leagues</ion-label>
    </ion-tab-button>

    <ion-tab-button [class.active-tab]="activeMoreTab$ | async" id="more">
      <ion-icon name="ellipsis-horizontal"></ion-icon>
      <ion-label>More</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>

<ion-modal #modal trigger="more" [initialBreakpoint]="0.45" [breakpoints]="[0, 0.35, 0.45, 0.5, 0.75]">
  <ng-template>
    <ion-content>
      <ion-list>
        @for (tab of moreTabs; track tab.path) {
          <ion-item class="tab-btn" button [routerLink]="tab.path" routerLinkActive="active-tab" (click)="modal.dismiss()">
            <ion-icon slot="start" [src]="tab.src" [name]="tab.src ? null : tab.icon"></ion-icon>
            <ion-label>{{ tab.label }}</ion-label>
          </ion-item>
        }
      </ion-list>
    </ion-content>
  </ng-template>
</ion-modal>
