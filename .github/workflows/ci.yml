name: CI

on:
  pull_request:
  push:
    branches: [main, master, test]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11
        # package-lock.json is written by npm 11, which nests webpack-dev-server's
        # chokidar@3.6.0 subtree under it. npm 10 (what Node 22 ships) expects those
        # four packages hoisted to the root instead and rejects the lockfile as out
        # of sync. Predates this pipeline — it just had no CI to surface it.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck specs
        # The unit-test builder transpiles without failing on type errors, so specs
        # are only typechecked here (see CLAUDE.md > Gotchas).
        run: npx tsc -p tsconfig.spec.json --noEmit

      - name: Install Chromium for Vitest browser mode
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npx ng test --configuration=ci

      - name: Build
        run: npm run build

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11
        # package-lock.json is written by npm 11, which nests webpack-dev-server's
        # chokidar@3.6.0 subtree under it. npm 10 (what Node 22 ships) expects those
        # four packages hoisted to the root instead and rejects the lockfile as out
        # of sync. Predates this pipeline — it just had no CI to surface it.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Vitest browser mode
        run: npx playwright install --with-deps chromium

      - name: Unit tests with coverage
        # Fails on its own if line coverage drops below the threshold in
        # vitest.coverage.config.ts.
        run: npm run test:coverage

      - name: Summarise coverage
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/coverage-summary.mjs > coverage-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file coverage-comment.md \
            --edit-last --create-if-none
