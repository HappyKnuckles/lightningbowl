<svg aria-label="Ball path on the lane" class="shot-lane" role="img" [attr.viewBox]="viewBox">
  <rect class="lane" [attr.height]="lane.height" [attr.width]="lane.width" [attr.x]="lane.x" [attr.y]="lane.y" />

  @for (line of boardLines(); track line.x) {
    <line class="board" [attr.x1]="line.x" [attr.x2]="line.x" [attr.y1]="lane.y" [attr.y2]="lane.y + lane.height" [class.major]="line.major" />
  }
  @for (line of distanceLines; track line.ft) {
    <line class="distance" [attr.x1]="lane.x" [attr.x2]="lane.x + lane.width" [attr.y1]="line.y" [attr.y2]="line.y" />
    <text class="axis" text-anchor="end" [attr.x]="lane.x - 4" [attr.y]="line.y + 3">{{ line.ft }}</text>
  }
  @for (arrow of arrows(); track arrow.key) {
    <polygon class="arrow" [attr.points]="arrow.points" />
  }
  @for (pin of pins; track pin.key) {
    <circle class="pin" [attr.cx]="pin.x" [attr.cy]="pin.y" [attr.r]="pinRadius" />
  }
  @for (label of boardLabels(); track label.board) {
    <text class="axis" text-anchor="middle" [attr.x]="label.x" [attr.y]="lane.y + lane.height + 16">{{ label.board }}</text>
  }

  <path class="ball-path" [attr.d]="path()" />

  @for (marker of markers(); track marker.key) {
    <circle class="marker" r="4.5" [attr.cx]="marker.x" [attr.cy]="marker.y" [class.breakpoint]="marker.key === 'breakpoint'" />
    <text
      class="marker-label"
      [attr.text-anchor]="marker.labelLeft ? 'end' : 'start'"
      [attr.x]="marker.labelLeft ? marker.x - 8 : marker.x + 8"
      [attr.y]="marker.y + 3.5">
      {{ marker.label }}
    </text>
  }
</svg>
