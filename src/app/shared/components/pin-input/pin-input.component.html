<div class="pin-input-container">
  @if (showStatsButton()) {
    <ion-button class="stats-btn" fill="clear" size="small" [disabled]="!statsEnabled()" (click)="statsClick.emit()">
      <ion-icon name="bar-chart-outline" slot="icon-only"></ion-icon>
    </ion-button>
  }

  @for (row of pinRows(); track $index) {
    <div class="pin-row">
      @for (pin of row; track pin.number) {
        <ion-button
          class="pin"
          [class.active]="pin.active"
          [class.knocked-down]="pin.knockedDown"
          [disabled]="pin.disabled"
          (click)="togglePin(pin.number)">
          {{ pin.number }}
        </ion-button>
      }
    </div>
  }

  <div class="quick-actions">
    <ion-button size="small" [disabled]="!canStrike() || isGameComplete()" (click)="recordStrike()"> X </ion-button>
    <ion-button size="small" [disabled]="!canSpare() || isGameComplete()" (click)="recordSpare()"> / </ion-button>
    <ion-button size="small" [disabled]="isGameComplete()" (click)="recordGutter()"> - </ion-button>

    <ion-button size="small" [disabled]="!hasSelection() || isGameComplete()" (click)="clearSelectedPins()">
      <ion-icon name="close-circle-outline" slot="icon-only"></ion-icon>
    </ion-button>
    <ion-button size="small" [disabled]="!canUndo()" (click)="undoLastThrow()">
      <ion-icon name="arrow-undo-outline" slot="icon-only"></ion-icon>
    </ion-button>
    <ion-button size="small" [disabled]="isGameComplete()" (click)="confirmThrow()">
      <ion-icon name="checkmark-outline" slot="icon-only"></ion-icon>
    </ion-button>
  </div>
</div>
