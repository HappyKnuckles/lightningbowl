<div class="score-toolbar" [class.show]="show()" [ngStyle]="{ bottom: offset() + 'px' }">
  <ion-button [disabled]="strikeDisabled()" (click)="onStrikeClick()" (mousedown)="$event.preventDefault()"> X </ion-button>
  <ion-button [disabled]="spareDisabled()" (click)="onSpareClick()" (mousedown)="$event.preventDefault()"> / </ion-button>
</div>
